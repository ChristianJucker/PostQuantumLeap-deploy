name: air-gapped bundle

# Packages the PUBLISHED image as loadable tarballs and attaches them to a
# release here, for sites that cannot pull from a registry.
#
# ── Why this runs in THIS repository and not in the product repository ──
#
# The product's publish script writes two files side by side into dist/:
# pql-app-<v>.tar.gz, which is FOR CUSTOMERS, and pql-<v>-src.tar.gz, which is
# the PROPRIETARY SOURCE and must never be published. The script says so in a
# warning to its own operator, because that adjacency is exactly how the wrong
# one gets attached to a release.
#
# Running the packaging here removes the possibility rather than guarding it:
# this repository has no source in it, and this job builds the bundle from the
# public image it pulls anonymously. There is no src archive on the runner to
# attach by mistake. The check below is a second line, not the first.
#
# ── ONE BUNDLE PER ARCHITECTURE, and why it cannot be one file ──
#
# `docker save` writes the image for ONE platform. It has no manifest-list form:
# saving a multi-arch tag on an amd64 machine silently produces an amd64-only
# tarball, which is why `3.0.0`'s bundle was amd64-only while the image beside it
# had been multi-arch for a day and nothing anywhere disagreed.
#
# So each architecture is pulled and saved on its OWN NATIVE RUNNER and attached
# as its own asset. Two downloads and the customer picks, rather than one file
# carrying an image half of them cannot run. The alternative — `docker save` of
# both platforms into one archive — needs a containerd-backed store the runner
# does not have, and would double every customer's download to ship them a copy
# of an architecture they do not own.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published image version to package, e.g. 3.1.0 (no leading v)'
        required: true
        type: string

permissions:
  contents: write   # create the release and upload the assets

jobs:
  # The release must exist BEFORE the matrix uploads into it. Two parallel jobs
  # racing to `gh release create` is a 422 for whichever loses.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${V}"

          # Quoted heredoc: the notes contain markdown code fences, and an
          # unquoted one would run everything between the backticks as command
          # substitution instead of writing it out. The version is substituted
          # afterwards rather than interpolated, for the same reason.
          cat > notes.md <<'NOTES'
          Air-gapped bundle for `__VERSION__`.

          **Pick the file that matches the machine you will run it on.** `docker save`
          writes one architecture per file, so there is no "both" download.

          ```bash
          uname -m     # x86_64 -> amd64,  aarch64/arm64 -> arm64
          ```

          ```bash
          sha256sum -c pql-app-__VERSION__-amd64.tar.gz.sha256
          docker load < pql-app-__VERSION__-amd64.tar.gz
          ```

          Then set `PQL_IMAGE=ghcr.io/christianjucker/pql-app:__VERSION__` in your `.env`.

          Loading the wrong one is not silent: the container starts and dies
          immediately with `exec format error`, and the app never appears in
          `docker compose ps`.

          Pre-stage `postgres:16` and `caddy:2.11.4` the same way — the stack needs
          all three images and only one of them is in this bundle.
          NOTES
          sed -i "s/__VERSION__/${V}/g" notes.md
          # The heredoc is indented to stay inside this YAML block scalar; strip
          # that indent back off before GitHub renders it as markdown.
          sed -i 's/^          //' notes.md

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Post Quantum Leap $V" --notes-file notes.md
          else
            gh release edit "$tag" --notes-file notes.md
          fi

  bundle:
    needs: release
    strategy:
      fail-fast: false      # an arm64 runner shortage must not lose the amd64 bundle
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No docker/login-action, deliberately. Pulling ANONYMOUSLY is what makes
      # this job double as a standing check that the image customers are told to
      # pull can actually be pulled by someone who is not us.
      - name: Pull the published image
        env:
          V: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/christianjucker/pql-app:${V}"
          if ! docker pull --platform "linux/${ARCH}" "$image"; then
            echo "::error::anonymous pull of $image for linux/${ARCH} failed — the version may not exist, the package may not be public, or the manifest may not carry this platform" >&2
            exit 1
          fi
          docker image inspect "$image" --format 'pulled {{.Id}} ({{.Architecture}})'

      # THE CHECK THAT MAKES THIS WORTH SPLITTING. A native runner usually pulls
      # the right platform, but "usually" is how the amd64-only bundle shipped.
      # Assert the ARCHITECTURE OF THE THING ABOUT TO BE SAVED, not of the runner.
      - name: The pulled image really is this architecture
        env:
          V: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          got="$(docker image inspect "ghcr.io/christianjucker/pql-app:${V}" --format '{{.Architecture}}')"
          if [ "$got" != "$ARCH" ]; then
            echo "::error::expected linux/${ARCH} but the local image is ${got} — this bundle would be mislabelled" >&2
            exit 1
          fi
          echo "confirmed ${got}"

      - name: Package
        env:
          V: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="pql-app-${V}-${ARCH}.tar.gz"
          docker save "ghcr.io/christianjucker/pql-app:${V}" | gzip > "$out"
          sha256sum "$out" > "${out}.sha256"
          ls -lh "$out"
          cat "${out}.sha256"

      - name: Refuse to upload anything but the bundle
        run: |
          set -euo pipefail
          # Belt and braces behind the structural guarantee described at the top.
          if ls ./*src*.tar.gz >/dev/null 2>&1; then
            echo "::error::a source archive is present on the runner — refusing to publish" >&2
            exit 1
          fi
          echo "no source archive present"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="pql-app-${V}-${ARCH}.tar.gz"
          gh release upload "v${V}" "$out" "${out}.sha256" --clobber
