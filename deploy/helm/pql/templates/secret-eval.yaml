{{- if .Values.eval.generateSecrets }}
{{/*
⚠ EVALUATION ONLY, AND THE VALIDATION IN _helpers.tpl MAKES YOU SAY SO TWICE.

`lookup` reads the Secret this release already installed, so an in-cluster
`helm upgrade` preserves every value. It returns an EMPTY MAP under
`helm template`, `helm install --dry-run` and every GitOps renderer — so under
ArgoCD or Flux this block silently mints a NEW SETTINGS_ENC_KEY on each sync and
every stored SSO client secret becomes undecryptable.

That is why the supported path is `existingSecret` and this one needs
`eval.acknowledgeEphemeral=true`.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-generated" (include "pql.fullname" .))) -}}
{{- $data := (default (dict) (get $existing "data")) -}}

{{- if and .Release.IsUpgrade (not $data) -}}
{{- fail "\n\nUpgrading a release whose generated Secret cannot be read.\n\n`lookup` returned nothing, which means either the Secret was deleted or this\nrender is happening outside the cluster (helm template / ArgoCD / Flux).\nProceeding would mint a new SETTINGS_ENC_KEY and make every stored SSO client\nsecret undecryptable.\n\nRecover the existing Secret, or move to `existingSecret` — which is the\nsupported path and does not have this failure mode.\n" -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pql.fullname" . }}-generated
  labels: {{- include "pql.labels" . | nindent 4 }}
  annotations:
    "pql.io/unsupported": "generated in-cluster; not safe under helm template or GitOps"
type: Opaque
data:
  {{/* Preserve, or mint. Every value is base64 as the Secret API requires. */}}
  POSTGRES_PASSWORD: {{ get $data "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  APP_DB_PASSWORD: {{ get $data "APP_DB_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  SESSION_SECRET_KEY: {{ get $data "SESSION_SECRET_KEY" | default (randAlphaNum 64 | b64enc) }}
  {{/*
    A Fernet key is urlsafe-base64 of exactly 32 bytes — NOT an arbitrary
    string. `randBytes` already returns standard base64; the app calls
    Fernet(key), which rejects anything else, so a plain randAlphaNum here would
    crash the container on boot with an opaque binascii error.
  */}}
  SETTINGS_ENC_KEY: {{ get $data "SETTINGS_ENC_KEY" | default (randBytes 32 | b64enc) }}
  INITIAL_ADMIN_USERNAME: {{ get $data "INITIAL_ADMIN_USERNAME" | default (.Values.eval.initialAdminUsername | b64enc) }}
  INITIAL_ADMIN_PASSWORD: {{ get $data "INITIAL_ADMIN_PASSWORD" | default (printf "Eval-%s" (randAlphaNum 20) | b64enc) }}
{{- end }}
